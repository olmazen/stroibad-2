name: Deploy public artifact to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve immutable source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build and run all quality gates
        run: npm run check
      - name: Ensure checks did not mutate tracked source
        run: git diff --exit-code
      - name: Verify release provenance
        run: node tools/verify-release-artifact.mjs --dir dist --commit "${{ steps.source.outputs.sha }}"
      - name: Preserve the exact staging release
        uses: actions/upload-artifact@v4
        with:
          name: egoe-release-${{ steps.source.outputs.sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy staging
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
