name: Prepare archive-only artifact (not production)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Reviewed commit SHA or tag to package"
        required: true
        default: "main"
        type: string
      label:
        description: "Optional human-readable release label"
        required: false
        type: string

run-name: "Prepare archive only: ${{ inputs.label || inputs.ref }}"

permissions:
  contents: read

concurrency:
  group: prepare-release-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package archive not eligible for production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout requested source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Use PHP 8.2 for the real SQLite backend test
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, curl
          coverage: none

      - name: Install locked dependencies
        run: npm ci

      - name: Build and run all quality gates
        run: npm run check

      - name: Require clean, reproducible source
        run: |
          git diff --exit-code
          node tools/verify-release-artifact.mjs --dir dist --commit "${{ steps.source.outputs.sha }}"

      - name: Upload immutable archive-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: egoe-archive-only-${{ steps.source.outputs.sha }}
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
          compression-level: 6

      - name: Summary
        shell: bash
        run: |
          echo "## Archive-only artifact prepared" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment: **not performed**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production eligibility: **none; production accepts only the artifact from a successful Pages run on main**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`egoe-archive-only-${{ steps.source.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
