name: Deploy approved staging release to REG.RU

on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: "Successful GitHub Pages workflow run ID"
        required: true
        type: string
      expected_sha:
        description: "Full 40-character commit SHA reviewed on staging"
        required: true
        type: string
      mode:
        description: "Preflight only or production deployment"
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - deploy
      confirmation:
        description: "For deploy mode, enter DEPLOY"
        required: false
        type: string

run-name: "REG.RU ${{ inputs.mode }}: ${{ inputs.expected_sha }}"

permissions:
  contents: read
  actions: read

concurrency:
  group: egoe-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the exact staging artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
      expected_sha: ${{ steps.input.outputs.sha }}
    steps:
      - name: Require production workflow from main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production workflow must be dispatched from main"
            exit 1
          fi
      - name: Validate inputs
        id: input
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full lowercase commit SHA"
            exit 1
          fi
          if [[ ! "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::staging_run_id must be numeric"
            exit 1
          fi
          if [[ "$MODE" == "deploy" && "$CONFIRMATION" != "DEPLOY" ]]; then
            echo "::error::Deploy mode requires confirmation DEPLOY"
            exit 1
          fi
          echo "sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout trusted deployment tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the reviewed SHA to be the current deployment source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.input.outputs.sha }}
        run: |
          git cat-file -e "$EXPECTED_SHA^{commit}"
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
      - name: Verify staging workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.input.outputs.sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" > "$RUNNER_TEMP/staging-run.json"
          node --input-type=module - "$RUNNER_TEMP/staging-run.json" "$EXPECTED_SHA" <<'NODE'
          import fs from 'node:fs';
          const run = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expectedSha = process.argv[3];
          if (run.path !== '.github/workflows/pages.yml') throw new Error(`Unexpected workflow: ${run.path}`);
          if (run.status !== 'completed' || run.conclusion !== 'success') throw new Error('Staging run is not successful');
          if (run.head_sha !== expectedSha) throw new Error(`Staging SHA ${run.head_sha} does not match ${expectedSha}`);
          if (run.head_branch !== 'main') throw new Error(`Staging branch is ${run.head_branch}, not main`);
          NODE
      - name: Download the exact staging release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.input.outputs.sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: |
          mkdir "$RUNNER_TEMP/release"
          gh run download "$STAGING_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "egoe-release-$EXPECTED_SHA" \
            --dir "$RUNNER_TEMP/release"
      - name: Verify every release file
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.input.outputs.sha }}
        run: node tools/verify-release-artifact.mjs --dir "$RUNNER_TEMP/release" --commit "$EXPECTED_SHA"
      - name: Package verified release
        id: archive
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.input.outputs.sha }}
        run: |
          archive="$RUNNER_TEMP/egoe-release-$EXPECTED_SHA.tar.gz"
          tar -C "$RUNNER_TEMP/release" -czf "$archive" .
          sha256=$(sha256sum "$archive" | awk '{print $1}')
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Preserve verified production candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: egoe-production-candidate-${{ steps.input.outputs.sha }}
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  production:
    name: REG.RU ${{ inputs.mode }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.REG_PUBLIC_URL }}
    steps:
      - name: Checkout trusted deployment tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: ops/deploy
      - name: Download verified production candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: egoe-production-candidate-${{ needs.verify.outputs.expected_sha }}
          path: ${{ runner.temp }}/candidate
      - name: Verify transport archive checksum
        shell: bash
        env:
          EXPECTED_ARCHIVE_SHA: ${{ needs.verify.outputs.archive_sha256 }}
        run: |
          archive=$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          test -n "$archive"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA"
      - name: Validate REG.RU environment values
        shell: bash
        env:
          REG_SSH_HOST: ${{ vars.REG_SSH_HOST }}
          REG_SSH_PORT: ${{ vars.REG_SSH_PORT }}
          REG_SSH_USER: ${{ vars.REG_SSH_USER }}
          REG_DEPLOY_ROOT: ${{ vars.REG_DEPLOY_ROOT }}
          REG_PUBLIC_URL: ${{ vars.REG_PUBLIC_URL }}
        run: |
          node --input-type=module <<'NODE'
          const env = process.env;
          const fail = (message) => { throw new Error(message); };
          if (!/^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)*[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/i.test(env.REG_SSH_HOST || '')) {
            fail('REG_SSH_HOST must be a plain DNS hostname');
          }
          if (!/^[0-9]{1,5}$/.test(env.REG_SSH_PORT || '')) fail('REG_SSH_PORT must be numeric');
          const port = Number(env.REG_SSH_PORT);
          if (!Number.isInteger(port) || port < 1 || port > 65535) fail('REG_SSH_PORT is outside 1..65535');
          if (!/^[a-z_][a-z0-9._-]{0,63}$/i.test(env.REG_SSH_USER || '')) fail('REG_SSH_USER is unsafe');
          const root = env.REG_DEPLOY_ROOT || '';
          if (!/^\/[A-Za-z0-9._/-]+$/.test(root)) fail('REG_DEPLOY_ROOT contains unsafe shell characters');
          if (root.endsWith('/') || root.includes('//') || root.split('/').some((part) => part === '.' || part === '..')) {
            fail('REG_DEPLOY_ROOT must be a normalized absolute path without a trailing slash');
          }
          const protectedRoots = new Set(['/', '/bin', '/boot', '/dev', '/etc', '/home', '/root', '/tmp', '/usr', '/var', '/var/www', '/www']);
          if (protectedRoots.has(root)) fail('REG_DEPLOY_ROOT is too broad');
          if (env.REG_PUBLIC_URL !== 'https://www.egoe-life.ru') fail('REG_PUBLIC_URL must be the canonical HTTPS origin');
          console.log('REG.RU deployment variables passed strict validation.');
          NODE
      - name: Configure isolated SSH credentials
        shell: bash
        env:
          REG_SSH_PRIVATE_KEY: ${{ secrets.REG_SSH_PRIVATE_KEY }}
          REG_SSH_KNOWN_HOSTS: ${{ secrets.REG_SSH_KNOWN_HOSTS }}
          REG_SSH_HOST: ${{ vars.REG_SSH_HOST }}
          REG_SSH_PORT: ${{ vars.REG_SSH_PORT }}
        run: |
          ssh_dir="$RUNNER_TEMP/egoe-ssh"
          install -m 700 -d "$ssh_dir"
          printf '%s\n' "$REG_SSH_PRIVATE_KEY" > "$ssh_dir/deploy-key"
          chmod 600 "$ssh_dir/deploy-key"
          printf '%s\n' "$REG_SSH_KNOWN_HOSTS" > "$ssh_dir/known-hosts"
          chmod 600 "$ssh_dir/known-hosts"
          ssh-keygen -y -f "$ssh_dir/deploy-key" >/dev/null
          known_host="$REG_SSH_HOST"
          if [[ "$REG_SSH_PORT" != "22" ]]; then known_host="[$REG_SSH_HOST]:$REG_SSH_PORT"; fi
          ssh-keygen -F "$known_host" -f "$ssh_dir/known-hosts" >/dev/null
          echo "EGOE_SSH_KEY=$ssh_dir/deploy-key" >> "$GITHUB_ENV"
          echo "EGOE_KNOWN_HOSTS=$ssh_dir/known-hosts" >> "$GITHUB_ENV"
      - name: Check REG.RU deployment host
        shell: bash
        env:
          REG_SSH_HOST: ${{ vars.REG_SSH_HOST }}
          REG_SSH_PORT: ${{ vars.REG_SSH_PORT }}
          REG_SSH_USER: ${{ vars.REG_SSH_USER }}
          REG_DEPLOY_ROOT: ${{ vars.REG_DEPLOY_ROOT }}
        run: |
          ssh -i "$EGOE_SSH_KEY" -p "$REG_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$EGOE_KNOWN_HOSTS" -o ConnectTimeout=20 \
            "$REG_SSH_USER@$REG_SSH_HOST" \
            "sh -s -- '$REG_DEPLOY_ROOT'" <<'REMOTE'
          set -eu
          deploy_root=$1
          case "$deploy_root" in
            /*) ;;
            *) exit 20 ;;
          esac
          test -d "$deploy_root"
          test ! -L "$deploy_root"
          test -f "$deploy_root/state/site-hostname"
          test "$(cat "$deploy_root/state/site-hostname")" = "egoe-life.ru"
          test -f "$deploy_root/state/production-enabled"
          test ! -L "$deploy_root/state/production-enabled"
          test "$(cat "$deploy_root/state/production-enabled")" = "egoe-life.ru"
          collection_marker="$deploy_root/state/collection-approved"
          collection_marker_approved=false
          if test -e "$collection_marker" || test -L "$collection_marker"; then
            test ! -L "$collection_marker"
            test -f "$collection_marker"
            php -r '
              $value = file_get_contents($argv[1]);
              exit($value === "egoe-life.ru" ? 0 : 1);
            ' "$collection_marker"
            collection_marker_approved=true
          fi
          relay_marker="$deploy_root/state/relay-approved"
          relay_marker_approved=false
          if test -e "$relay_marker" || test -L "$relay_marker"; then
            test ! -L "$relay_marker"
            test -f "$relay_marker"
            php -r '
              $value = file_get_contents($argv[1]);
              exit($value === "egoe-life.ru" ? 0 : 1);
            ' "$relay_marker"
            relay_marker_approved=true
          fi
          telegram_history_marker="$deploy_root/state/telegram-history-approved"
          telegram_delivery_marker="$deploy_root/state/telegram-delivery-approved"
          telegram_history_marker_approved=false
          telegram_delivery_marker_approved=false
          for marker_record in \
            "telegram_history:$telegram_history_marker" \
            "telegram_delivery:$telegram_delivery_marker"; do
            marker_name=${marker_record%%:*}
            marker_path=${marker_record#*:}
            if test -e "$marker_path" || test -L "$marker_path"; then
              test ! -L "$marker_path"
              test -f "$marker_path"
              php -r '
                $value = file_get_contents($argv[1]);
                $stat = lstat($argv[1]);
                exit($value === "egoe-life.ru" && is_array($stat) && (($stat["mode"] & 0777) === 0600) ? 0 : 1);
              ' "$marker_path"
              case "$marker_name" in
                telegram_history) telegram_history_marker_approved=true ;;
                telegram_delivery) telegram_delivery_marker_approved=true ;;
                *) exit 23 ;;
              esac
            fi
          done
          for directory in incoming releases shared state; do
            test -d "$deploy_root/$directory"
            test ! -L "$deploy_root/$directory"
          done
          test -d "$deploy_root/shared/leads"
          test ! -L "$deploy_root/shared/leads"
          for command_name in tar sha256sum php id ln mv readlink grep find sort flock cmp; do
            command -v "$command_name" >/dev/null
          done
          php -r '
            exit(PHP_VERSION_ID >= 80200
              && extension_loaded("pdo_sqlite")
              && extension_loaded("sqlite3")
              && method_exists("SQLite3", "backup")
              && extension_loaded("mbstring")
              && extension_loaded("curl") ? 0 : 1);
          '
          current_uid=$(id -u)
          php -r '
            $expectedUid = (int) $argv[1];
            $paths = [
              [$argv[2], 0040000, null],
              [$argv[3], 0040000, null],
              [$argv[4], 0100000, null],
              [$argv[5], 0100000, null],
            ];
            if ($argv[6] !== "") $paths[] = [$argv[6], 0100000, null];
            if ($argv[7] !== "") $paths[] = [$argv[7], 0100000, 0600];
            if ($argv[8] !== "") $paths[] = [$argv[8], 0100000, 0600];
            if ($argv[9] !== "") $paths[] = [$argv[9], 0100000, 0600];
            foreach ($paths as [$path, $expectedType, $expectedMode]) {
              $stat = lstat($path);
              if (!is_array($stat)
                || $stat["uid"] !== $expectedUid
                || ($stat["mode"] & 0170000) !== $expectedType
                || ($stat["mode"] & 0022) !== 0) exit(1);
              if ($expectedMode !== null && ($stat["mode"] & 0777) !== $expectedMode) exit(2);
            }
          ' "$current_uid" \
            "$deploy_root" \
            "$deploy_root/state" \
            "$deploy_root/state/site-hostname" \
            "$deploy_root/state/production-enabled" \
            "$([ -f "$collection_marker" ] && printf '%s' "$collection_marker" || true)" \
            "$([ -f "$relay_marker" ] && printf '%s' "$relay_marker" || true)" \
            "$([ -f "$telegram_history_marker" ] && printf '%s' "$telegram_history_marker" || true)" \
            "$([ -f "$telegram_delivery_marker" ] && printf '%s' "$telegram_delivery_marker" || true)"
          test -w "$deploy_root/shared/leads"
          test -L "$deploy_root/current"
          current_target=$(readlink "$deploy_root/current")
          case "$current_target" in releases/*) ;; *) exit 21 ;; esac
          current_name=${current_target#releases/}
          case "$current_name" in ''|.|..|*/*|*[!A-Za-z0-9._-]*) exit 22 ;; esac
          test -d "$deploy_root/$current_target"
          test ! -L "$deploy_root/$current_target"
          current_lead_cli="$deploy_root/current/api/leads/cli/leads.php"
          if test -e "$current_lead_cli" || test -L "$current_lead_cli"; then
            test ! -L "$current_lead_cli"
            test -f "$current_lead_cli"
            lead_health=$(EGOE_DEPLOY_ROOT="$deploy_root" php "$current_lead_cli" health)
            printf '%s' "$lead_health" | php -r '
              $health = json_decode(stream_get_contents(STDIN), true);
              $collectionApproved = ($argv[1] ?? "false") === "true";
              $relayApproved = ($argv[2] ?? "false") === "true";
              $telegramHistoryApproved = ($argv[3] ?? "false") === "true";
              $telegramDeliveryApproved = ($argv[4] ?? "false") === "true";
              $collectionEnabled = $health["collectionEnabled"] ?? null;
              $relayEnabled = $health["relayEnabled"] ?? null;
              $telegramHistoryEnabled = $health["telegramHistoryEnabled"] ?? false;
              $telegramDeliveryEnabled = $health["telegramDeliveryEnabled"] ?? false;
              exit(is_array($health)
                && ($health["ok"] ?? false) === true
                && ($health["schemaVersion"] ?? null) === 2
                && is_bool($collectionEnabled)
                && ($collectionApproved || $collectionEnabled === false)
                && is_bool($relayEnabled)
                && ($relayEnabled === false || $relayApproved)
                && is_bool($telegramHistoryEnabled)
                && ($telegramHistoryEnabled === false || $telegramHistoryApproved)
                && is_bool($telegramDeliveryEnabled)
                && ($telegramDeliveryEnabled === false || ($telegramDeliveryApproved && $telegramHistoryApproved && $telegramHistoryEnabled && $relayEnabled === false)) ? 0 : 1);
            ' "$collection_marker_approved" "$relay_marker_approved" "$telegram_history_marker_approved" "$telegram_delivery_marker_approved"
          else
            test "$relay_marker_approved" = false
            test "$telegram_history_marker_approved" = false
            test "$telegram_delivery_marker_approved" = false
          fi
          df -h "$deploy_root"
          REMOTE
      - name: Stop after safe preflight
        if: ${{ inputs.mode == 'preflight' }}
        run: echo "REG.RU preflight passed; no release was uploaded or activated."
      - name: Upload release and deployment helper
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          REG_SSH_HOST: ${{ vars.REG_SSH_HOST }}
          REG_SSH_PORT: ${{ vars.REG_SSH_PORT }}
          REG_SSH_USER: ${{ vars.REG_SSH_USER }}
          REG_DEPLOY_ROOT: ${{ vars.REG_DEPLOY_ROOT }}
          EXPECTED_SHA: ${{ needs.verify.outputs.expected_sha }}
        run: |
          archive=$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)
          scp -i "$EGOE_SSH_KEY" -P "$REG_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$EGOE_KNOWN_HOSTS" -o ConnectTimeout=20 \
            "$archive" \
            "$REG_SSH_USER@$REG_SSH_HOST:$REG_DEPLOY_ROOT/incoming/$EXPECTED_SHA.tar.gz.part"
          scp -i "$EGOE_SSH_KEY" -P "$REG_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$EGOE_KNOWN_HOSTS" -o ConnectTimeout=20 \
            ops/deploy/remote-release.sh \
            "$REG_SSH_USER@$REG_SSH_HOST:$REG_DEPLOY_ROOT/incoming/remote-release.sh.part"
          ssh -i "$EGOE_SSH_KEY" -p "$REG_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$EGOE_KNOWN_HOSTS" -o ConnectTimeout=20 \
            "$REG_SSH_USER@$REG_SSH_HOST" \
            "mv '$REG_DEPLOY_ROOT/incoming/$EXPECTED_SHA.tar.gz.part' '$REG_DEPLOY_ROOT/incoming/$EXPECTED_SHA.tar.gz' && mv '$REG_DEPLOY_ROOT/incoming/remote-release.sh.part' '$REG_DEPLOY_ROOT/incoming/remote-release.sh'"
      - name: Atomically activate release
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          REG_SSH_HOST: ${{ vars.REG_SSH_HOST }}
          REG_SSH_PORT: ${{ vars.REG_SSH_PORT }}
          REG_SSH_USER: ${{ vars.REG_SSH_USER }}
          REG_DEPLOY_ROOT: ${{ vars.REG_DEPLOY_ROOT }}
          EXPECTED_SHA: ${{ needs.verify.outputs.expected_sha }}
          ARCHIVE_SHA256: ${{ needs.verify.outputs.archive_sha256 }}
        run: |
          ssh -i "$EGOE_SSH_KEY" -p "$REG_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$EGOE_KNOWN_HOSTS" -o ConnectTimeout=20 \
            "$REG_SSH_USER@$REG_SSH_HOST" \
            "sh '$REG_DEPLOY_ROOT/incoming/remote-release.sh' deploy '$REG_DEPLOY_ROOT' '$EXPECTED_SHA' '$REG_DEPLOY_ROOT/incoming/$EXPECTED_SHA.tar.gz' '$ARCHIVE_SHA256'"
      - name: Smoke-test production and roll back on failure
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          REG_PUBLIC_URL: ${{ vars.REG_PUBLIC_URL }}
          REG_SSH_HOST: ${{ vars.REG_SSH_HOST }}
          REG_SSH_PORT: ${{ vars.REG_SSH_PORT }}
          REG_SSH_USER: ${{ vars.REG_SSH_USER }}
          REG_DEPLOY_ROOT: ${{ vars.REG_DEPLOY_ROOT }}
          EXPECTED_SHA: ${{ needs.verify.outputs.expected_sha }}
        run: |
          set +e
          failed=0
          smoke_token="$EXPECTED_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for path in / /catalog/ /maf/skamejki/artdeco-a1-101/ /cart/ /contacts/ /privacy/ /consent/ /cookies/ /assets/js/site.js /release.json; do
            curl --fail --location --silent --show-error --retry 2 --max-time 30 \
              --header 'Cache-Control: no-cache, no-store' \
              "$REG_PUBLIC_URL$path?egoe_deploy=$smoke_token" >/dev/null || failed=1
          done
          release_sha=$(curl --fail --location --silent --show-error --retry 2 --max-time 30 \
            --header 'Cache-Control: no-cache, no-store' \
            "$REG_PUBLIC_URL/release.json?egoe_deploy=$smoke_token" \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).source.commit))')
          if [[ "$release_sha" != "$EXPECTED_SHA" ]]; then
            failed=1
          fi
          ssh -i "$EGOE_SSH_KEY" -p "$REG_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$EGOE_KNOWN_HOSTS" -o ConnectTimeout=20 \
            "$REG_SSH_USER@$REG_SSH_HOST" \
            "sh '$REG_DEPLOY_ROOT/incoming/remote-release.sh' preflight '$REG_DEPLOY_ROOT'" \
            >/dev/null || failed=1
          lead_health=$(ssh -i "$EGOE_SSH_KEY" -p "$REG_SSH_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$EGOE_KNOWN_HOSTS" -o ConnectTimeout=20 \
            "$REG_SSH_USER@$REG_SSH_HOST" \
            "EGOE_DEPLOY_ROOT='$REG_DEPLOY_ROOT' php '$REG_DEPLOY_ROOT/current/api/leads/cli/leads.php' health")
          health_contract=$(printf '%s' "$lead_health" | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk).on("end", () => {
              const health = JSON.parse(data);
              if (health.ok !== true || health.schemaVersion !== 2
                || typeof health.collectionEnabled !== "boolean"
                || typeof health.relayEnabled !== "boolean"
                || typeof health.telegramHistoryEnabled !== "boolean"
                || typeof health.telegramDeliveryEnabled !== "boolean"
                || (health.telegramDeliveryEnabled && (health.relayEnabled || !health.telegramHistoryEnabled))) process.exit(1);
              process.stdout.write(`${health.collectionEnabled}:${health.relayEnabled}`);
            });
          ')
          collection_expected=${health_contract%%:*}
          relay_expected=${health_contract#*:}
          if [[ "$collection_expected" != "true" && "$collection_expected" != "false" ]]; then
            failed=1
          fi
          if [[ "$relay_expected" != "true" && "$relay_expected" != "false" ]]; then
            failed=1
          fi
          collection_headers="$RUNNER_TEMP/egoe-collection-headers"
          collection_body="$RUNNER_TEMP/egoe-collection-body"
          collection_status=$(curl --silent --show-error --retry 2 --max-time 30 \
            --header 'Accept: application/json' \
            --header 'Cache-Control: no-cache, no-store' \
            --dump-header "$collection_headers" \
            --output "$collection_body" \
            --write-out '%{http_code}' \
            "$REG_PUBLIC_URL/api/leads/status/?egoe_deploy=$smoke_token")
          if [[ "$collection_status" != "200" ]] || ! node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const expected = process.argv[2] === "true";
            if (Object.keys(body).length !== 1 || body.enabled !== expected) process.exit(1);
          ' "$collection_body" "$collection_expected"; then
            failed=1
          fi
          grep -Eiq '^cache-control:[[:space:]].*no-store' "$collection_headers" || failed=1
          if [[ "$collection_expected" == "false" ]]; then
            disabled_body="$RUNNER_TEMP/egoe-disabled-body"
            disabled_status=$(curl --silent --show-error --retry 2 --max-time 30 \
              --request POST \
              --header 'Accept: application/json' \
              --header 'Cache-Control: no-cache, no-store' \
              --output "$disabled_body" \
              --write-out '%{http_code}' \
              "$REG_PUBLIC_URL/api/leads/?egoe_deploy=$smoke_token")
            if [[ "$disabled_status" != "503" ]] || ! node -e '
              const fs = require("node:fs");
              const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              if (body.ok !== false || body.code !== "COLLECTION_DISABLED") process.exit(1);
            ' "$disabled_body"; then
              failed=1
            fi
          fi
          api_headers="$RUNNER_TEMP/egoe-api-headers"
          api_body_file="$RUNNER_TEMP/egoe-api-body"
          api_status=$(curl --silent --show-error --retry 2 --max-time 30 \
            --header 'Accept: application/json' \
            --header 'Cache-Control: no-cache, no-store' \
            --dump-header "$api_headers" \
            --output "$api_body_file" \
            --write-out '%{http_code}' \
            "$REG_PUBLIC_URL/api/leads/?egoe_deploy=$smoke_token")
          if [[ "$api_status" != "405" ]] || ! node -e '
            const fs = require("node:fs");
            let data = "";
            data = fs.readFileSync(process.argv[1], "utf8");
            const body = JSON.parse(data);
            if (body.ok !== false || body.code !== "METHOD_NOT_ALLOWED") process.exit(1);
          ' "$api_body_file"; then
            failed=1
          fi
          for required_header in \
            '^x-content-type-options:[[:space:]]*nosniff' \
            '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' \
            '^x-frame-options:[[:space:]]*SAMEORIGIN' \
            '^permissions-policy:' \
            '^strict-transport-security:'; do
            grep -Eiq "$required_header" "$api_headers" || failed=1
          done
          for protected_path in \
            /api/leads/index.php \
            /api/leads/index.php/anything \
            /api/leads/index \
            /api/leads/lib/LeadBackend.php \
            /api/leads/lib/DailyAnalytics.php \
            /api/leads/lib/DailyAnalytics.php/anything \
            /api/leads/cli/leads.php \
            /api/leads/cli/daily-report.php \
            /api/leads/cli/daily-report.php/anything \
            /api/telegram/index.php \
            /api/telegram/index.php/anything \
            /api/telegram/index \
            /api/telegram/lib/TelegramHistory.php \
            /api/telegram/lib/TelegramHistory.php/anything \
            /api/telegram/cli/telegram.php \
            /api/telegram/cli/telegram.php/anything; do
            protected_status=$(curl --silent --show-error --retry 2 --max-time 30 \
              --header 'Cache-Control: no-cache, no-store' \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$REG_PUBLIC_URL$protected_path?egoe_deploy=$smoke_token")
            [[ "$protected_status" == "404" ]] || failed=1
          done
          if [[ "$failed" -ne 0 ]]; then
            ssh -i "$EGOE_SSH_KEY" -p "$REG_SSH_PORT" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$EGOE_KNOWN_HOSTS" -o ConnectTimeout=20 \
              "$REG_SSH_USER@$REG_SSH_HOST" \
              "sh '$REG_DEPLOY_ROOT/incoming/remote-release.sh' rollback '$REG_DEPLOY_ROOT'"
            echo "::error::Production smoke test failed; previous release restored"
            exit 1
          fi
          echo "Production release $EXPECTED_SHA is healthy."
