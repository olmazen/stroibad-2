<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Коммерческое предложение · EGOE</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../assets/css/kp.css?v=kp11">
<link rel="stylesheet" href="../assets/css/fonts.css">
</head>
<body>

<!-- Панель управления (не печатается) -->
<div class="kp-toolbar no-print">
  <div class="kp-tb-l">
    <a class="kp-tb-back" href="../cart/">← Корзина</a>
    <span class="kp-tb-mode">Коммерческое предложение</span>
  </div>
  <div class="kp-tb-r">
    <span class="kp-tb-hint">Формат A4 · со всеми фото и чертежами</span>
    <button class="kp-tb-print2" type="button" id="kpPrintOnly" disabled>Печать</button>
    <button class="kp-tb-print" type="button" id="kpPrintBtn" disabled>Скачать PDF</button>
  </div>
</div>

<!-- Документ (рендерит kp.js) -->
<main class="kp-doc" id="kp" aria-live="polite"></main>

<!-- Штамп-подвал: position:fixed, повторяется на каждой печатной странице -->
<div class="kp-stamp" id="kpStamp" aria-hidden="true"></div>

<!-- Сигнал готовности для Puppeteer / автопечати -->
<span id="kp-ready" hidden></span>

<script src="../assets/js/kp.js?v=6ceb5aedefd1"></script>
</body>
</html>
